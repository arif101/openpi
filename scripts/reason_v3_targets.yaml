# Hardcoded end-effector targets for REASON-VLA v3 MPPI refinement.
#
# Each entry says: "for THIS task, MPPI should prefer trajectories that
# end with the gripper near these xyz coordinates."
#
# This is a Week-2 prototype hack. Week 3 work: replace this YAML with
# automatic BDDL goal-predicate parsing that derives targets from the
# task's success criteria programmatically.
#
# The targets below are EDUCATED GUESSES. They were inferred from task
# descriptions; the actual world-frame coordinates would need to be
# verified against the LIBERO scene. To find the right xyz, you can
# look at the BDDL file or run the env and inspect object positions.
#
# Coordinate frame: world frame (z up). Typical LIBERO tabletop has
# table surface at z ≈ 0.82, objects at z ≈ 0.86-0.95.

libero_10:
