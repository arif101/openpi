# REASON-VLA v3 MPPI cost targets per LIBERO task.
#
# Schema (per task entry):
#   description:  human-readable task language
#   mode:         "object"  → MPPI cost tracks an object body toward goal_xyz.
#                              Naturally handles "put X in Y" multi-stage tasks:
#                              once the robot grasps X, X tracks the EE, so
#                              driving X → Y encodes both pick and place.
#                 "ee"      → cost tracks the end-effector toward goal_xyz.
#                              Use for tasks with no manipulated object that
#                              moves to a goal (e.g. push a drawer closed).
#   track_bodies: [list of MuJoCo body names] (mode="object")
#                              If >1 body is listed, MPPI picks the one
#                              currently farthest from goal_xyz at each
#                              decision step. That gives free task sequencing
#                              for compound goals ("put both X and Y in basket")
#                              without explicit stage logic.
#   goal_xyz:     [x, y, z] world-frame target position
#
# Body positions come from scripts/inspect_libero_scene.py output. Verify
# targets with scripts/verify_libero_targets.py before running MPPI.

libero_10:
  # 0: "put both alphabet soup and tomato sauce in basket"
  0:
    description: "put both the alphabet soup and the tomato sauce in the basket"
    mode: object
    track_bodies: [alphabet_soup_1_main, tomato_sauce_1_main]
    goal_xyz: [-0.002, 0.269, 0.480]   # basket_1_main

  # 1: "put both cream cheese box and butter in basket"
  1:
    description: "put both the cream cheese box and the butter in the basket"
    mode: object
    track_bodies: [cream_cheese_1_main, butter_1_main]
    goal_xyz: [0.007, 0.265, 0.480]    # basket_1_main

  # 2: "turn on stove + put moka pot on it" — Turnon has no object body.
  #    Use the moka pot → stove burner; the button-press is a side-effect of
  #    the policy's prior. (For tasks dominated by Turnon, switch to mode: ee.)
  2:
    description: "turn on the stove and put the moka pot on it"
    mode: object
    track_bodies: [moka_pot_1_main]
    goal_xyz: [-0.041, 0.198, 0.905]   # flat_stove_1_burner

  # 3: "put bowl in bottom drawer + close drawer"
  3:
    description: "put the black bowl in the bottom drawer of the cabinet and close it"
    mode: object
    track_bodies: [akita_black_bowl_1_main]
    goal_xyz: [-0.010, 0.161, 0.905]   # white_cabinet_1_cabinet_bottom

  # 4: "white mug on left plate + yellow mug on right plate"
  4:
    description: "put the white mug on the left plate and put the yellow and white mug on the right plate"
    mode: object
    track_bodies: [porcelain_mug_1_main, white_yellow_mug_1_main]
    goal_xyz: [-0.004, -0.323, 0.480]  # plate_1_main (left); white mug goes here. ymw → plate_2 if we extend schema.

  # 5: "pick up book + place in back compartment of caddy"
  5:
    description: "pick up the book and place it in the back compartment of the caddy"
    mode: object
    track_bodies: [black_book_1_main]
    goal_xyz: [-0.391, -0.142, 0.887]  # desk_caddy_1_main (approx — back compartment)

  # 6: "white mug on plate + chocolate pudding to right of plate"
  6:
    description: "put the white mug on the plate and put the chocolate pudding to the right of the plate"
    mode: object
    track_bodies: [porcelain_mug_1_main, chocolate_pudding_1_main]
    goal_xyz: [0.149, 0.006, 0.480]    # plate_1_main

  # 7: "put alphabet soup and cream cheese box in basket"
  7:
    description: "put both the alphabet soup and the cream cheese box in the basket"
    mode: object
    track_bodies: [alphabet_soup_1_main, cream_cheese_1_main]
    goal_xyz: [-0.000, 0.267, 0.480]   # basket_1_main

  # 8: "put both moka pots on stove + turn on"
  8:
    description: "put both moka pots on the stove"
    mode: object
    track_bodies: [moka_pot_1_main, moka_pot_2_main]
    goal_xyz: [-0.044, -0.199, 0.905]  # flat_stove_1_burner

  # 9: "mug in microwave + close microwave"
  9:
    description: "put the yellow and white mug in the microwave and close it"
    mode: object
    track_bodies: [white_yellow_mug_1_main]
    goal_xyz: [-0.010, 0.357, 0.920]   # microwave_1_main interior
